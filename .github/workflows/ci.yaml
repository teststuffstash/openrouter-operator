# CI — thin. All logic lives in `devbox run ci` (devbox.json + scripts/ci.sh), so the exact same
# gate runs locally and here, with tool versions pinned by devbox, not this YAML. Runs on the
# homelab self-hosted runner (Actions Runner Controller, ephemeral laptop tier): homelab-ephemeral.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One live run per PR (org standard — homelab docs/ci.md §Concurrency, from oracle-fleet#222):
# a superseded PR head's run cancels instead of queuing; push/master runs keep their own serial
# group and never cancel (a cancelled push run can leave a publish half-written).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: homelab-ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No toolchain install: the ARC runner image bakes single-user Nix + devbox + the LAN
      # nix substituter (homelab docker/arc-runner/, FU-015).
      # The carved-out dep-bump lane's replacement owner (CODEOWNERS un-owns devbox.{json,lock};
      # this asserts a PR touching them is a pure version/hash diff — pin-only-lint doctrine).
      - name: deps-pin-guard (carved-out dep lane)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: devbox run -- sh scripts/deps-pin-guard.sh

      - name: Lint + type-check + test (devbox run ci)
        run: devbox run ci

      - name: Secret scan (devbox run scan-secrets)
        run: devbox run scan-secrets

      # pin-only-lint (homelab ADR-100 addendum, S9 #1990): the `.github/workflows` pin gate. Runs
      # homelab's MASTER script (sparse checkout) — a fix there reaches every caller at once. The
      # lint allows only verified action pin bumps (`uses: owner/repo@sha # tag`, SHA resolved
      # upstream to the tag's commit) in workflow files; any other workflow edit takes the
      # operator path to master, where this check does not run. This is what replaces the code
      # owner on /.github/workflows/ (CODEOWNERS) — a rule stricter than the review it stands in for.
      - name: Fetch homelab's pin-only-lint at master
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: teststuffstash/homelab
          ref: master
          path: .homelab-lint
          sparse-checkout: |
            scripts/pin-only-lint.sh
            devbox.json
            devbox.lock
          sparse-checkout-cone-mode: false

      - name: Guarded files may only receive pin bumps (pin-only-lint)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PIN_ONLY_REPO: ${{ github.workspace }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          devbox run --config "$GITHUB_WORKSPACE/.homelab-lint" -- bash "$GITHUB_WORKSPACE/.homelab-lint/scripts/pin-only-lint.sh" "$BASE_SHA"
