apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrouter-operator
  namespace: {{ .Release.Namespace }}
  labels: { app: openrouter-operator }
spec:
  replicas: 1
  strategy: { type: Recreate } # a single kopf operator instance (no leader election configured)
  selector:
    matchLabels: { app: openrouter-operator }
  template:
    metadata:
      labels: { app: openrouter-operator }
    spec:
      serviceAccountName: openrouter-operator
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--standalone"] # single instance, no peering/leases needed
          env:
            - name: OPENROUTER_MANAGEMENT_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.managementSecret.name }}, key: {{ .Values.managementSecret.key }} }
            # kopf's getpass.getuser() needs a name — the nonroot UID 65532 has no /etc/passwd entry
            - name: LOGNAME
              value: operator
            - name: USER
              value: operator
          ports:
            - { containerPort: 8080, name: health }
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
