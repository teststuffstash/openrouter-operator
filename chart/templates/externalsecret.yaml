{{- if .Values.managementSecret.create }}
# The OpenRouter MANAGEMENT (provisioning) key the operator uses to mint per-project runtime keys.
# Infisical → ESO delivers it into this namespace. Tier-0 secret — never in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.managementSecret.name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.managementSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.managementSecret.storeRef.name }}
    kind: {{ .Values.managementSecret.storeRef.kind }}
  target:
    name: {{ .Values.managementSecret.name }}
  data:
    - secretKey: {{ .Values.managementSecret.key }}
      remoteRef:
        key: {{ .Values.managementSecret.key }}
{{- end }}
