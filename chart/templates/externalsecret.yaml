{{- if .Values.managementSecret.create }}
{{- $es := .Values.managementSecret.externalSecret }}
{{- if not $es.storeRef.name }}{{ fail "managementSecret.create=true requires managementSecret.externalSecret.storeRef.name (your SecretStore/ClusterSecretStore)" }}{{- end }}
# The OpenRouter MANAGEMENT (provisioning) key the operator uses to mint per-project runtime keys.
# Delivered from YOUR secret store via external-secrets.io. Tier-0 secret — never in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.managementSecret.name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.storeRef.name }}
    kind: {{ $es.storeRef.kind }}
  target:
    name: {{ .Values.managementSecret.name }}
  data:
    - secretKey: {{ .Values.managementSecret.key }}
      remoteRef:
        key: {{ $es.remoteRef.key | default .Values.managementSecret.key }}
{{- end }}
