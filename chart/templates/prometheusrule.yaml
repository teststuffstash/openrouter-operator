{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
{{- $rpd := .Values.metrics.prometheusRule.keyOpsPerDay }}
{{- $bal := .Values.metrics.prometheusRule.accountBalance }}
# Alert rules for the two exhaustions that stacked in the 2026-08-08 fleet stall (issue #27,
# deliverable 3): the key-management API's daily op budget, and the account credit those keys
# spend out of. One group each — they are different subsystems with different remedies (wait out
# the UTC reset vs top up the account).
#
# The balance alert was WITHHELD by PR #32 and lands here as #33: #26/#29 had not exported the
# gauge yet, and a rule with no series behind it never fires, so it would have read as "healthy"
# forever — the exact blind spot the issue exists to close. `test_every_alert_has_a_series_behind_it`
# keeps that structural rather than advisory.
#
# Picked up cluster-wide without a platform change: kube-prometheus-stack runs with
# `ruleSelectorNilUsesHelmValues: false`.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openrouter-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app: openrouter-operator
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: openrouter-operator.key-api
      rules:
        - alert: OpenRouterKeyOpsDailyBudgetNearlyExhausted
          # `keys-modify-api-rpd-v2` bounds the MODIFY ops, so `get` is excluded: reads share the
          # metric but not the budget, and counting them would fire on plain reconcile churn.
          # sum() over one series per op — the Deployment is replicas:1/Recreate, so there is never
          # a second instance to double-count. The gauge is process-local and rolls at UTC
          # midnight (the same window the limit resets on); an operator restart re-reads as 0,
          # which under-reports rather than false-alarms.
          expr: sum(openrouter_key_api_ops_today{op=~"create|update|delete"}) > {{ divf (mulf $rpd.ceiling $rpd.warnAtPercent) 100 }}
          for: {{ $rpd.for }}
          labels:
            severity: warning # never `info`: the stock InfoInhibitor silently suppresses those
            # capacity/standing fact — the remedy is waiting for the UTC reset or raising the
            # account's limit, never a code change. An agent triaging this would defer on the very
            # limit the alert reports (precedent: SubscriptionDispatchLimited).
            triage: none
          annotations:
            summary: OpenRouter key-API daily op budget is nearly exhausted
            description: >-
              The operator has issued {{ `{{ $value }}` }} key-modify operations (create/update/delete)
              against the OpenRouter key API so far today, past {{ $rpd.warnAtPercent }}% of the
              {{ $rpd.ceiling }}/day `keys-modify-api-rpd-v2` ceiling. Once that ceiling is reached
              every mint, budget patch and delete is rejected until the next UTC midnight: new
              OpenRouterKey resources stall unminted and deleted ones wedge on their finalizers.
    - name: openrouter-operator.account
      rules:
        - alert: OpenRouterAccountCreditNearlyExhausted
          # A self-scaling low-water mark: the balance is worth less than `burnMultiplier` days of
          # what the fleet actually spends. #29 exports no usage counter, so the burn IS the
          # balance gauge's own 24h decrease — there is no second series to rate() against.
          #
          # Each term below exists because without it the rule is quietly unsatisfiable, which for
          # an alert is indistinguishable from "everything is fine":
          #   clamp_min(…, 0)  a top-up RAISES the gauge, making delta positive and the derived
          #                    burn negative; `balance < 2 * negative` can never hold. Clamped, an
          #                    inverted trend degrades to "burn unknown" and the floor takes over.
          #   or … < floorUsd  a zero or unknown burn leaves a zero mark, equally unsatisfiable.
          #                    The floor is a disjunct rather than a clamp_min around the whole
          #                    mark on purpose: the gauge is NaN until the first successful poll,
          #                    clamp_min(NaN, x) is NaN in PromQL, and that NaN would swallow the
          #                    floor for the whole 24h the range window covers.
          #   and time() - …   the false-alarm direction. A reading nobody refreshed is not
          #                    evidence of a drained account. The timestamp is 0 when no poll ever
          #                    succeeded, so a never-polled operator is maximally stale and cannot
          #                    page. Poller death is its own symptom, on
          #                    openrouter_account_credit_poll_failures_total, not this rule.
          expr: >-
            (
            openrouter_account_credit_usd < {{ $bal.burnMultiplier }} * clamp_min(-delta(openrouter_account_credit_usd[24h]), 0)
            or
            openrouter_account_credit_usd < {{ $bal.floorUsd }}
            )
            and
            (time() - openrouter_account_credit_updated_timestamp_seconds) < {{ $bal.maxStalenessSeconds }}
          for: {{ $bal.for }}
          labels:
            severity: warning # never `info`: the stock InfoInhibitor silently suppresses those
            # capacity/standing fact — the remedy is a human topping up the account, never a code
            # change (precedent: SubscriptionDispatchLimited).
            triage: none
          annotations:
            summary: OpenRouter account credit is nearly exhausted
            description: >-
              The OpenRouter account has ${{ `{{ $value }}` }} of credit left — under
              {{ $bal.burnMultiplier }}x its own trailing-24h burn (floor ${{ $bal.floorUsd }}), so
              roughly {{ $bal.burnMultiplier }} days of runway at the current rate. At zero, every
              request the minted keys make is rejected while the operator keeps reconciling and the
              OpenRouterKey resources keep reporting healthy — the keys still exist, only the
              traffic through them fails. Top up the account; no code change fixes this.
{{- end }}
