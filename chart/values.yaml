image:
  repository: ghcr.io/teststuffstash/openrouter-operator
  # empty → defaults to .Chart.AppVersion (== chart version == the released tag). Pin here only to
  # override; normally the chart version IS the image version.
  tag: ""
  pullPolicy: IfNotPresent # version tag is immutable, so no need to re-pull

# The operator needs a Secret holding the OpenRouter MANAGEMENT (provisioning) key. GENERIC by default —
# nothing cluster-specific here. Two ways to supply it:
#   (a) create the Secret yourself (any mechanism) → keep create:false and point name/key at it.
#   (b) let the chart render an ExternalSecret (needs external-secrets.io) → set create:true and fill
#       externalSecret.storeRef + remoteRef for YOUR secret store (e.g. Vault, AWS SM, Infisical, …).
managementSecret:
  create: false
  name: openrouter-management
  key: OPENROUTER_MANAGEMENT_KEY
  externalSecret:
    refreshInterval: 1h
    storeRef: { name: "", kind: ClusterSecretStore } # name REQUIRED when create:true
    remoteRef: { key: "" } # the key's name in YOUR store; defaults to managementSecret.key if empty

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }

# Prometheus wiring for the key-API op counters (issue #27). Default-on: the operator is always
# deployed alongside monitoring, and the counters it exports are only useful once scraped.
metrics:
  enabled: true
  port: 9090 # the exporter's port; the container port, Service and METRICS_PORT all follow it
  serviceMonitor:
    enabled: true # set false on a cluster without the prometheus-operator CRDs
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {} # e.g. {release: kube-prometheus-stack} when Prometheus selects on a label
  prometheusRule:
    enabled: true
    additionalLabels: {}
    keyOpsPerDay:
      # OpenRouter does not publish the `keys-modify-api-rpd-v2` ceiling, and it is per-account.
      # 1000 matches the only per-day request cap OpenRouter documents; treat it as a PLACEHOLDER
      # and override it with the `X-RateLimit-Limit` header returned on a real 429.
      ceiling: 1000
      warnAtPercent: 70
      for: 10m
    # Account credit low-water mark (issue #33). Self-scaling: the mark follows what the fleet
    # actually spends, so it stays meaningful as usage grows instead of aging into a stale dollar
    # figure. Burn is derived from the balance gauge's own 24h decrease — #29 exports no usage
    # counter to rate() against.
    accountBalance:
      # Days of runway to warn at: the mark is burnMultiplier x the trailing-24h burn, so 2 fires
      # with roughly two days left at the current rate.
      burnMultiplier: 2
      # Absolute floor, in USD, under the self-scaling mark. It carries the alert whenever burn is
      # unknown or zero — a fresh operator, an idle day, or a top-up that inverted the trend —
      # where the scaling term alone would be unsatisfiable. Like `ceiling` above, a PLACEHOLDER:
      # nobody has measured this fleet's daily spend yet, so raise it once someone has.
      floorUsd: 5
      # How old the last successful credits poll may be before the alert goes quiet, in seconds.
      # A reading nobody refreshed is not evidence of a drained account, and the poller defaults
      # to every 300s, so this is ~12 missed polls. Poller death is its own symptom — watch
      # `openrouter_account_credit_poll_failures_total`, not this rule.
      maxStalenessSeconds: 3600
      # Longer than the key-ops alert: ~2 days of runway is not a fast-moving symptom, and the
      # balance only refreshes every 300s, so a short window would just flap on the threshold.
      for: 30m
    # Missing Secret alert for healthy upstream keys (issue #60). A k8s Secret deletion out of
    # band is the failure mode. The remedy is operator action: re-create the Secret or unmint
    # the OpenRouterKey CR.
    secretMissing:
      for: 10m
